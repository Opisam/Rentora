# Render Blueprint — Rentora full stack, no Docker
# Provision everything via Render Dashboard → New → Blueprint → pick this repo.
# Values marked `sync: false` are prompted once during first sync.

databases:
  - name: rentora-db
    databaseName: rentora
    user: rentora
    plan: free

services:
  # ---------------- Express API ----------------
  - type: web
    name: rentora-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22            # match the CI/CD runtime
      - key: DATABASE_URL
        fromDatabase:
          name: rentora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Rate limits fall back to code defaults in prod (300 global / 10 auth).
      - key: CORS_ORIGIN
        sync: false          # set to your static site URL, e.g. https://rentora-web.onrender.com

  # ---------------- React SPA (static) ----------------
  - type: web
    name: rentora-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: no
    routes:
      # SPA fallback: client-side routes like /browse resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # set to your API URL, e.g. https://rentora-api.onrender.com
